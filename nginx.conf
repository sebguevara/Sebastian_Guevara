server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Favicon / brand icons — short cache so logo updates are visible quickly
  location ~* ^/(favicon\.(ico|svg)|favicon-32x32\.png|apple-touch-icon\.png|logo\.(svg|png)|icon-192\.png|icon-512\.png|site\.webmanifest)$ {
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Astro emits hashed assets — cache them forever
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
